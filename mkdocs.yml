site_name: NativeMods 3.29 Documentation
site_description: Path of Exile 3.29 client script extender, .NET 10 Client SDK, LocalExile ServerBridge, AssetPipeline, and Waypoint dual-side modding reference.
repo_name: LocalExile/NativeMods
docs_dir: docs

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - csharp
    - cpp
    - json
    - xml
    - bash

markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true
  - admonition

nav:
  - Home:
      - Documentation Home: README.md
      - Modding Reference Index: modding-reference.md
  - Guides:
      - Getting Started: guides/getting-started.md
      - UI & Stock Screens: guides/ui-and-screens.md
      - Input, Hover & Pre-Game: guides/input-hover-pregame.md
      - World, Filter, Stats & Camera: guides/world-filter-stats-camera.md
      - ServerBridge & Registries: guides/server-bridge.md
      - Content, Assets & Packaging: guides/content-and-assets.md
      - Testing & Live Proton: guides/testing-and-proton.md
      - Harvest Garden Walkthrough: guides/harvest-garden-walkthrough.md
  - Capabilities & Limits:
      - Capabilities & Hard Engine Ceilings: guides/capabilities-and-limits.md
  - Autogenerated API Reference:
      - API Index (A–Z): api/README.md
      - SDK — Core & Address Library: api/sdk-core.md
      - SDK — UI, Screens & Toasts: api/sdk-ui-screens.md
      - SDK — Input, Hover & Pre-Game: api/sdk-input-hover-pregame.md
      - SDK — World, Filter, Stats & Camera: api/sdk-world-filter-stats-camera.md
      - SDK — Net, Files, Raw & Extend: api/sdk-net-files-raw-extend.md
      - ServerBridge: api/server-bridge.md
      - AssetPipeline: api/asset-pipeline.md
      - Waypoint Integration: api/waypoint.md
  - Architecture & Internals:
      - Address Library: architecture/address-library.md
      - Patcher & Native Shim: architecture/patcher-and-shim.md
      - Waypoint Integration: architecture/waypoint-integration.md
  - Verification Reports:
      - Spike R1 Proton Results: reports/r1-proton-results.md
      - Maxwell Pet MTX PoC Results: reports/maxwell-pet-poc.md
  - Historical Archive:
      - Initial Design Docs (01–12): archive/initial-design/README.md
